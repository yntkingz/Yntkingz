name: Build Hey Dost APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Hey-Dost-Android-Prototype.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack sources
        run: unzip -q Hey-Dost-Android-Prototype.zip -d "$RUNNER_TEMP/dost-source"
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test command parser
        working-directory: ${{ runner.temp }}/dost-source/hey-dost
        run: |
          mkdir -p /tmp/dost-tests
          javac -d /tmp/dost-tests app/src/main/java/in/heydost/Recipe.java tests/RecipeTest.java
          java -cp /tmp/dost-tests RecipeTest
      - name: Build debug APK
        working-directory: ${{ runner.temp }}/dost-source/hey-dost
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hey-Dost-APK
          path: ${{ runner.temp }}/dost-source/hey-dost/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
